<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Pagination & Buttons</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        .pagination {
            display: inline-block;
            margin-top: 30px;
        }

        .pagination a {
            color: black;
            float: left;
            padding: 8px 16px;
            text-decoration: none;
            transition: background-color 0.3s;
            border: 1px solid #ddd;
            margin: 0 4px;
            border-radius: 5px;
        }

        .pagination a.active {
            background-color: #4CAF50;
            color: white;
            border: 1px solid #4CAF50;
        }

        .pagination a:hover:not(.active) {
            background-color: #ddd;
            transform: scale(1.1);
        }

        .btn-group {
            margin-top: 30px;
        }

        .btn-custom {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            border: none;
            color: white;
            padding: 10px 24px;
            margin: 5px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>
    <h2>CSS Pagination</h2>

    <div class="pagination">
        <a href="#">&laquo;</a>
        <a href="#">1</a>
        <a href="#" class="active">2</a>
        <a href="#">3</a>
        <a href="#">4</a>
        <a href="#">5</a>
        <a href="#">&raquo;</a>
    </div>

    <div class="btn-group">
        <button class="btn-custom">Sebelumnya</button>
        <button class="btn-custom">Halaman 2</button>
        <button class="btn-custom">Selanjutnya</button>
    </div>
</body>
</html>
