<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Border Images & Buttons</title>

    <style>
        .border-image-box {
            width: 400px;
            padding: 20px;
            margin: 20px auto;
            border: 30px solid transparent;
            border-image: repeating-linear-gradient(
                45deg,
                #f09433,
                #d62976,
                #962fbf
            ) 30;
            text-align: center;
            font-family: Arial;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            margin: 10px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 8px;
        }

        .btn-primary {
            background: #3498db;
            color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .btn-primary:hover {
            background: #2980b9;
            transform: scale(1.05);
        }

        .btn-gradient {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: white;
            border-radius: 50px;
        }

        .btn-gradient:hover {
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>
    <div class="border-image-box">
        <h2>CSS Border Images</h2>

        <p>Border menggunakan gradient sebagai gambar</p>

        <button class="btn btn-primary">Button Biasa</button>
        <button class="btn btn-gradient">Button Gradient</button>
    </div>
</body>
</html>
