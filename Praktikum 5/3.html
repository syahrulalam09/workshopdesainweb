<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 2D Transforms & Tooltip</title>

    <style>
        .gallery {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 50px;
            font-family: Arial;
        }

        .photo {
            width: 150px;
            height: 150px;
            background: teal;
            border-radius: 15px;
            transition: 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            position: relative;
        }

        /* 2D Transforms */
        .photo:hover {
            transform: rotate(5deg) scale(1.1) translateY(-10px);
            background: darkcyan;
        }

        /* Tooltip */
        .tooltip {
            position: relative;
            display: inline-block;
            margin: 50px auto;
            text-align: center;
        }

        .tooltip .tooltip-text {
            visibility: hidden;
            width: 200px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 8px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -100px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .tooltip:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
            transform: translateY(-5px);
        }

        .tooltip-text::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #333 transparent transparent transparent;
        }
    </style>
</head>

<body>
    <div class="gallery">
        <div class="photo">Rotate + Scale</div>
        <div class="photo">TranslateY</div>
    </div>

    <div class="tooltip">
        <button class="btn" style="padding: 10px 20px;">
            Hover untuk Tooltip
        </button>

        <span class="tooltip-text">
            CSS Tooltip keren! <br>
            2D Transforms juga diterapkan di sini.
        </span>
    </div>
</body>
</html>
